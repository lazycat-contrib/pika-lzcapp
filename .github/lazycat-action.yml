version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/pika.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: pika

build:
  toolchains: []
  run_buildscript: false

images:
  - id: pika
    target: service
    service: pika
    source: docker.io/dushixiang/pika
    channel: stable
    sort: semver
    # 上游版本 tag 为三段 SemVer（0.2.8）；latest / cache 与 sha256-* 都不是版本 tag
    tag_regex: '^[0-9]+[.][0-9]+[.][0-9]+$'
    delivery:
      # 镜像模式：用镜像代理加速拉取，并校验代理上的 digest 与上游一致
      mode: mirror
      require_digest_match: true
  # victoriametrics 固定在打包时确认过的 v1.131.0，不注册进 images[]
  # （保持 manifest 里的静态引用，升级由打包仓库统一跟进）

stores:
  official:
    # 官方商店审核要求免密登录与文件选择器拦截，本应用暂不提交官方商店
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Pika 探针监控
    summary: "轻量级探针监控系统：多台服务器实时性能指标、服务拨测、防篡改保护与安全审计，数据全部留在微服本地。"
